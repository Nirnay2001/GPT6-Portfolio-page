services:
  web:
    image: ${APP_IMAGE:-nirnay2001/gpt6-portfolio-page:latest}
    container_name: portfolio-web
    mem_limit: 244m
    cpus: 0.5
    volumes:
      - mydata:/mydata
    ports:
      - "80:80"
    networks:
      - app-net1
    environment:
      - APP_VERSION=${APP_VERSION}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: always

volumes:
  mydata:
    name: mydata

networks:
  app-net1:
    name: app-net1
    driver: bridge