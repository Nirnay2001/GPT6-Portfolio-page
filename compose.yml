services:
  web:
    image: nirnay2001/gpt6-portfolio-page:latest
    volumes:
      - mydata:/mydata
    ports:
      - "80:80"
    networks:
      - app-net1
    environment:
      - APP_VERSION=${APP_VERSION}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}

volumes:
  mydata:
    name: mydata

networks:
  app-net1:
    name: app-net1
    driver: bridge